services:
  fm-db:
    image: postgres:17-alpine
    container_name: fm-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: nestjs
    ports:
      - "5432:5432"
    volumes:
      - fm-db-data:/var/lib/postgresql/data

volumes:
  fm-db-data:
